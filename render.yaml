services:
  - type: web
    name: bellastyle-shop
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bellastyle-postgres
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: bellastyle-postgres
    databaseName: bellastyle
    user: bella_app
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
